name: Release All Addons

# On every push to main, packages every addon in the repo into its own zip
# (named "<Addon>-<Version>.zip") and publishes them all as assets on a
# single dated release for that push, tagged "addons-<date>-<short-sha>".
# Companion folders (e.g. Bagnon_Config, HidingBar_Options) are packaged
# together with their primary addon instead of getting their own asset.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '*.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be released without publishing'
        type: boolean
        default: false

jobs:
  release-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history needed so we can derive a fallback version (below)
          # from the last commit that touched a given addon folder.
          fetch-depth: 0

      - name: Package every addon
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          mkdir -p dist

          # Collect all top-level folders that own a matching .toc file.
          mapfile -t ALL_DIRS < <(find . -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort)

          # A folder is a "companion" (packaged with, not released as, another
          # addon) if its name is prefixed by another addon's own folder name
          # (e.g. TitanAmmo/Bagnon_Config/DataStore_Inventory are all prefixed
          # by Titan/Bagnon/DataStore respectively) - this must match the same
          # "${ADDON}*" glob used below to decide what gets zipped together.
          is_companion_of_existing_addon() {
            local dir="$1"
            for other in "${ALL_DIRS[@]}"; do
              [ "$other" = "$dir" ] && continue
              if [[ "$dir" == "${other}"* && -f "${other}/${other}.toc" ]]; then
                return 0
              fi
            done
            return 1
          }

          for dir in "${ALL_DIRS[@]}"; do
            TOC_FILE="${dir}/${dir}.toc"
            [ -f "$TOC_FILE" ] || continue
            is_companion_of_existing_addon "$dir" && continue

            ADDON="$dir"
            mapfile -t FOLDERS < <(find . -maxdepth 1 -type d -name "${ADDON}*" -printf "%f\n")

            # "|| true" prevents grep's exit-1-on-no-match from tripping
            # pipefail/set -e when a .toc has no ## Version: line at all.
            VERSION=$( (grep -i "^## Version:" "$TOC_FILE" || true) | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
            if [ -z "$VERSION" ]; then
              # No ## Version: field (e.g. DBM-* modules) - fall back to a
              # synthetic version tied to the last commit touching any of this
              # addon's bundled folders, so the asset name only changes when
              # the packaged content actually changes.
              SHA=$(git log -1 --format=%h -- "${FOLDERS[@]}" | tr -d '\r')
              VERSION="git-${SHA:-unknown}"
              echo "::notice::${ADDON} has no ## Version:, using fallback version ${VERSION}"
            fi

            # Zip/asset names can't contain whitespace (e.g. Titan's
            # "4.3.8.30300 - Revision 386"), so slugify it.
            SAFE_VERSION=$(echo "$VERSION" | tr -c '[:alnum:].' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
            ZIP="dist/${ADDON}-${SAFE_VERSION}.zip"

            echo "Packaging ${ADDON} ${VERSION}: ${FOLDERS[*]}"
            rm -f "$ZIP"
            zip -rq "$ZIP" "${FOLDERS[@]}"
          done

          echo "Packaged $(find dist -name '*.zip' | wc -l) addon(s) into dist/"

      - name: Create dated release with all addon assets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="addons-$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:7}"

          # Re-running the workflow on the same commit would collide on the
          # same tag - replace the prior release/tag so re-runs stay clean.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" dist/*.zip \
            --title "Addons $(date -u +%Y-%m-%d) (${GITHUB_SHA:0:7})" \
            --generate-notes

